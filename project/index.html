<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>냉장고 털이 · 홈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div class="app">
  <header class="top-bar">
    <a class="logo" href="index.html">냉장고 털이</a>
  </header>

  <!-- 1 홈 -->
  <section class="screen" id="home">
    <h2>집에 있는 재료로<br>지금 만들 수 있는 요리</h2>
    <p class="mu">재료만 입력하면 바로 알려드려요</p>
    <div class="box"><span class="mu">보유 재료 (2개 이상)</span>
      <input class="in" placeholder="재료 검색 (예: 계란)" aria-label="재료 검색">
      <div class="row" id="mine"><span class="chip on">계란 ✕</span><span class="chip on">양파 ✕</span><span class="chip on">김치 ✕</span></div>
      <div class="row"><span class="chip">+ 참치캔</span><span class="chip">+ 두부</span><span class="chip">+ 대파</span></div>
      <button class="btn dk" id="find" type="button">만들 수 있는 요리 찾기</button>
    </div>
    <p class="note">재료 칩을 누르면 삭제돼요. 2개 미만이면 검색 버튼이 비활성화돼요.</p>
  </section>
</div>

<button class="totop" aria-label="맨 위로">↑<br>TOP</button>
<nav class="tabbar">
  <a href="index.html" data-tab="home"><i>⌂</i>홈</a>
  <a href="list.html" data-tab="list"><i>☰</i>목록</a>
  <a href="my.html" data-tab="my"><i>☺</i>마이</a>
</nav>
<script src="app.js"></script>
</body>
</html>
